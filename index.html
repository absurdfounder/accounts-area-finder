<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5f8b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mandi Desk" />
    <title>Mandi Desk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header" id="appHeader">
        <div class="brand-row">
          <h1>Mandi Desk</h1>
          <div class="header-actions desktop-only">
            <button class="text-button" id="openSearchBtnDesktop" type="button">Search</button>
            <button class="text-button" id="openMoreBtnDesktop" type="button">More</button>
          </div>
        </div>

        <p class="session-line" id="sessionLine" hidden></p>

        <div class="view-tabs" role="tablist" aria-label="Main view">
          <button type="button" class="view-tab active" role="tab" data-view="timeline" id="tabTimeline" aria-selected="true">
            <span class="tab-icon" aria-hidden="true">▦</span>
            <span>Timeline</span>
          </button>
          <button type="button" class="view-tab" role="tab" data-view="cards" id="tabCards" aria-selected="false">
            <span class="tab-icon" aria-hidden="true">▣</span>
            <span>Cards</span>
          </button>
          <button type="button" class="view-tab" role="tab" data-view="table" id="tabTable" aria-selected="false">
            <span class="tab-icon" aria-hidden="true">☰</span>
            <span>Table</span>
          </button>
        </div>

        <section class="timeline-nav" id="timelineNav" hidden aria-label="Month navigator">
          <div class="timeline-nav-row">
            <div class="month-rail" id="monthRail" role="tablist" aria-label="Months"></div>
            <button type="button" class="text-button primary-tint jump-today-btn" id="jumpTodayBtn">Today</button>
          </div>
        </section>
      </header>

      <section class="results" aria-live="polite">
        <div class="view-panels" id="viewPanels">
          <div id="timelineView" class="view-panel timeline-view active" role="tabpanel" aria-labelledby="tabTimeline"></div>
          <div id="cardsView" class="view-panel cards-view" role="tabpanel" aria-labelledby="tabCards" aria-hidden="true"></div>
          <div id="tableView" class="view-panel table-wrap" role="tabpanel" aria-labelledby="tabTable" aria-hidden="true">
            <table>
              <thead>
                <tr>
                  <th>Party</th>
                  <th>Area</th>
                  <th>2023-24</th>
                  <th>2024-25</th>
                  <th>2025-26</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
        <p id="emptyState" class="empty-state" hidden>No accounts match these filters.</p>
      </section>
    </main>

    <nav class="bottom-nav mobile-only" id="bottomNav" aria-label="Primary">
      <button type="button" class="bottom-nav-item" data-nav="search" id="bottomSearchBtn">
        <span class="nav-icon" aria-hidden="true">⌕</span>
        <span>Search</span>
      </button>
      <button type="button" class="bottom-nav-item" data-nav="more" id="bottomMoreBtn">
        <span class="nav-icon" aria-hidden="true">⋯</span>
        <span>More</span>
      </button>
    </nav>

    <div class="sheet-backdrop" id="searchBackdrop" hidden></div>
    <aside class="filter-sheet search-sheet" id="searchSheet" aria-label="Search" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2>Search</h2>
        <button class="icon-button flat" id="closeSearchBtn" type="button" aria-label="Close search">×</button>
      </div>
      <label class="searchbar sheet-search">
        <span class="sr-only">Search accounts</span>
        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          enterkeyhint="search"
          placeholder="Party, code, area, phone"
        />
      </label>
      <p class="search-hint" id="searchHint">Search by party name, code, area, or phone number.</p>
    </aside>

    <div class="sheet-backdrop" id="moreBackdrop" hidden></div>
    <aside class="filter-sheet more-sheet" id="moreSheet" aria-label="More actions" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2>More</h2>
        <button class="icon-button flat" id="closeMoreBtn" type="button" aria-label="Close">×</button>
      </div>

      <div class="sheet-section">
        <h3 class="sheet-section-title">Filters</h3>
        <div class="sheet-controls compact">
          <label>
            <span>State</span>
            <select id="stateFilter"></select>
          </label>
          <label>
            <span>Region</span>
            <select id="regionFilter"></select>
          </label>
          <label>
            <span>Area</span>
            <select id="areaFilter"></select>
          </label>
        </div>
        <button type="button" class="menu-item subtle" id="clearFiltersBtn">Clear filters</button>
      </div>

      <div class="sheet-section">
        <h3 class="sheet-section-title">Contacts</h3>
        <div class="menu-list">
          <button type="button" class="menu-item" id="connectGoogleBtn">Connect Google</button>
          <button type="button" class="menu-item" id="importContactsBtn">Import contacts</button>
          <button type="button" class="menu-item" id="openMatchBtn">Match contacts</button>
        </div>
      </div>

      <div class="sheet-section">
        <h3 class="sheet-section-title">Actions</h3>
        <div class="menu-list">
          <button type="button" class="menu-item" id="resetBtn">Reset all</button>
          <button type="button" class="menu-item" id="jumpTodayBtnMobile">Jump to today</button>
        </div>
      </div>
    </aside>

    <div class="sheet-backdrop" id="partyBackdrop" hidden></div>
    <aside class="filter-sheet party-sheet" id="partySheet" aria-label="Party detail" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="partySheetTitle">Party</h2>
        <button class="icon-button flat" id="closePartyBtn" type="button" aria-label="Close party">×</button>
      </div>
      <div id="partySheetBody" class="party-sheet-body"></div>
    </aside>

    <input id="importFileInput" type="file" accept=".csv,.vcf,text/csv,text/vcard,text/x-vcard" hidden />

    <div class="sheet-backdrop" id="matchBackdrop" hidden></div>
    <aside class="filter-sheet match-sheet" id="matchSheet" aria-label="Match contacts" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2>Match contacts</h2>
        <button class="icon-button flat" id="closeMatchBtn" type="button" aria-label="Close match sheet">×</button>
      </div>

      <div class="match-summary" id="matchSummary"></div>
      <div class="match-toolbar">
        <button class="ghost-button compact" id="refreshContactsBtn" type="button">Refresh contacts</button>
        <button class="ghost-button compact" id="signOutBtn" type="button">Sign out</button>
      </div>
      <div class="match-list" id="matchList"></div>
      <p class="match-empty" id="matchEmpty" hidden>No suggestions right now. Connect Google or import contacts first.</p>
    </aside>

    <div class="toast" id="toast" hidden></div>

    <script src="./config.js"></script>
    <script src="./data.js"></script>
    <script src="./lots.js"></script>
    <script src="./contacts.js"></script>
    <script src="./matcher.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
